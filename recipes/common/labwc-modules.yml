modules:
    - type: rpm-ostree
      install:
        - labwc
        - labwc-session
        - labwc-menu-generator
        - labwc-tweaks 
        - sfwbar # Instead of waybar, can be replaced
        - xdg-desktop-portal-wlr
        - xdg-desktop-portal-gtk
        - alacritty
        - swaylock
        - swayidle
        - swaybg
        - wf-recorder # Screen recorder, recommended
    - type: files
      files:
        - source: system/labwc
          destination: /
