modules:
  - type: dnf
    repos:
      copr:
        enable:
          - nett00n/hyprland
    install:
      install-weak-deps: false
      packages:
        - kitty
        - hyprland
        - waybar
        - xdg-desktop-portal-hyprland
        - hyprpaper
        - hyprlock
        - hypridle
        - hyprland-guiutils #Hyprland GUI utilities (successor to hyprland-qtutils)

  - type: files
    files:
      - source: system/hyprland
        destination: /

  - type: script
    scripts:
      - removeunprofessionalwallpapers.sh
      - sethyprlandwaybarmodules.sh
