modules:
    - type: dnf
      repos:
        copr:
          enable:
            - craftidore/wayblueorg-hyprland
      install:
        install-weak-deps: false
        packages:
        - kitty
        - hyprland
        - waybar
        - xdg-desktop-portal-hyprland
        - hyprpaper
        - hyprlock
        - hypridle
        - hyprland-guiutils
        - hyprlauncher
        - hyprshutdown
        - hyprland-qt-support
        - hyprpicker
        - hyprpolkitagent
        - hyprpwcenter
        - hyprqt6engine
        - hyprsunset
        - hyprsysteminfo
        - hyprwayland-scanner

    - type: files
      files:
        - source: system/hyprland
          destination: /

    - type: script
      scripts:
        - removeunprofessionalwallpapers.sh
        - sethyprlandwaybarmodules.sh